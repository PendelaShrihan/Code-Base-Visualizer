services:
  app:
    build: .
    image: codebase-visualizer:latest
    ports:
      - "8001:8000"
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_HOST=redis
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen2.5-coder:1.5b
    volumes:
      - ./app:/app/app
      - ./parser:/app/parser
      - ./rag:/app/rag
      - ./worker:/app/worker

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s

  celery_worker:
    build: .
    image: codebase-visualizer:latest
    command: celery -A worker.celery_app worker --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_HOST=redis
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen2.5-coder:1.5b
    volumes:
      - ./app:/app/app
      - ./parser:/app/parser
      - ./rag:/app/rag
      - ./worker:/app/worker

  celery_beat:
    build: .
    image: codebase-visualizer:latest
    command: celery -A worker.celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_HOST=redis
    volumes:
      - ./worker:/app/worker
      - ./app:/app/app

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "(command -v curl >/dev/null && curl -sf http://localhost:6333/readyz) || (command -v wget >/dev/null && wget -qO- http://localhost:6333/readyz) || exit 0"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s


volumes:
  qdrant_data:

